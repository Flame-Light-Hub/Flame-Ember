<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1c28"/>
      <stop offset="40%" stop-color="#2e2a24"/>
      <stop offset="100%" stop-color="#3d3428"/>
    </linearGradient>
    <linearGradient id="vol" x1="0.7" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#c9a87a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8a6b4a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2a241c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4036"/>
      <stop offset="100%" stop-color="#2c261f"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- distant mountains -->
  <path d="M0 280 L180 180 L320 240 L480 140 L640 210 L820 120 L1000 200 L1200 160 L1200 630 L0 630 Z" fill="#2a241e"/>
  <path d="M0 320 L200 220 L380 280 L560 190 L740 260 L920 180 L1200 240 L1200 630 L0 630 Z" fill="#1e1a16" opacity="0.9"/>
  <!-- volumetric light from upper right -->
  <path d="M900 0 L1100 0 L700 630 L400 630 Z" fill="url(#vol)" filter="url(#soft)"/>
  <!-- mist / dirty atmosphere -->
  <ellipse cx="600" cy="420" rx="500" ry="80" fill="#5a4a3a" opacity="0.15"/>
  <!-- road -->
  <path d="M480 630 L580 380 L620 380 L720 630 Z" fill="url(#road)"/>
  <path d="M560 630 L590 420 L610 420 L640 630 Z" fill="#3a322a" opacity="0.6"/>
  <!-- small figure silhouette on road -->
  <path d="M595 480 L598 460 L605 458 L610 475 L615 500 L605 505 L595 500 Z" fill="#0f0d0a"/>
  <circle cx="602" cy="452" r="6" fill="#0f0d0a"/>
  <!-- faint distant light / lantern suggestion on horizon -->
  <circle cx="780" cy="250" r="12" fill="#e8c48a" opacity="0.25"/>
  <circle cx="780" cy="250" r="4" fill="#f0d8a8" opacity="0.6"/>
  <!-- ground texture lines -->
  <path d="M100 520 Q300 510 500 530 T900 520" stroke="#3a3228" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M200 560 Q400 550 600 570 T1000 555" stroke="#2a241c" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
