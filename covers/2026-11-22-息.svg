<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e14;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1c1814;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#3e3428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a4e3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="light" x1="40%" y1="5%" x2="60%" y2="85%">
      <stop offset="0%" style="stop-color:#f0e0c0;stop-opacity:0.55" />
      <stop offset="40%" style="stop-color:#d0b890;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#806850;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="22%" r="28%">
      <stop offset="0%" style="stop-color:#fff4e0;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fff4e0;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="780" cy="240" rx="280" ry="140" fill="url(#glow)"/>
  <!-- softer volumetric rays, quieter -->
  <polygon points="620,90 720,1000 520,1000" fill="#f4e8c8" opacity="0.08"/>
  <polygon points="760,60 860,1000 660,1000" fill="#fff0d8" opacity="0.12"/>
  <polygon points="900,140 1000,1000 800,1000" fill="#e8d0b0" opacity="0.06"/>
  <polygon points="540,180 640,1000 440,1000" fill="#d8c0a0" opacity="0.04"/>
  <!-- distant mountains, muted dirty browns -->
  <polygon points="0,640 200,500 400,560 600,440 800,520 1000,400 1200,480 1400,420 1600,540 1600,1000 0,1000" fill="#161210" opacity="0.8"/>
  <polygon points="100,680 300,540 500,600 700,480 900,540 1100,460 1300,520 1500,480 1600,560 1600,1000 0,1000" fill="#221c18" opacity="0.6"/>
  <!-- mid ridges -->
  <polygon points="0,740 160,620 360,680 560,580 760,660 960,570 1160,630 1360,580 1560,650 1600,680 1600,1000 0,1000" fill="#322820"/>
  <!-- road, still, dusty, slight curve -->
  <polygon points="420,1000 620,720 980,720 1180,1000" fill="#2a221c"/>
  <polygon points="500,1000 660,760 940,760 1100,1000" fill="#3a2e26" opacity="0.6"/>
  <!-- dirt texture, quieter -->
  <path d="M540 980 L700 780" stroke="#4a3c30" stroke-width="1.8" opacity="0.4" fill="none"/>
  <path d="M640 990 L760 790" stroke="#5a4a3c" stroke-width="1" opacity="0.25" fill="none"/>
  <path d="M880 985 L800 770" stroke="#4a3c30" stroke-width="1.4" opacity="0.3" fill="none"/>
  <!-- small figure silhouette, standing still, facing light, slight pause -->
  <g transform="translate(780,780)">
    <ellipse cx="0" cy="40" rx="18" ry="5" fill="#0c0a08" opacity="0.4"/>
    <path d="M-8,30 L-4,10 L0,-6 L4,10 L8,30 Z" fill="#100e0c"/>
    <circle cx="0" cy="-12" r="5.2" fill="#100e0c"/>
    <path d="M-12,20 Q-16,34 -8,40" stroke="#100e0c" stroke-width="1.6" fill="none"/>
    <path d="M12,20 Q16,34 8,40" stroke="#100e0c" stroke-width="1.6" fill="none"/>
    <!-- slight lean, resting -->
    <path d="M-2,-6 Q4,4 2,12" stroke="#100e0c" stroke-width="1.2" fill="none" opacity="0.7"/>
  </g>
  <!-- dust particles, fewer, softer -->
  <circle cx="580" cy="700" r="1.0" fill="#c8b090" opacity="0.35"/>
  <circle cx="700" cy="640" r="0.7" fill="#d0b898" opacity="0.25"/>
  <circle cx="900" cy="720" r="1.4" fill="#b8a080" opacity="0.3"/>
  <circle cx="820" cy="680" r="0.9" fill="#c0a888" opacity="0.28"/>
  <circle cx="650" cy="760" r="1.1" fill="#a89070" opacity="0.32"/>
</svg>
