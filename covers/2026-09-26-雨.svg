<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12141a"/>
      <stop offset="0.28" stop-color="#1c222c"/>
      <stop offset="0.55" stop-color="#2a3038"/>
      <stop offset="0.78" stop-color="#1a1e24"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="volLight" cx="0.62" cy="0.12" r="0.68">
      <stop offset="0" stop-color="#a8b8c8" stop-opacity="0.28"/>
      <stop offset="0.32" stop-color="#6a7888" stop-opacity="0.12"/>
      <stop offset="0.62" stop-color="#3a4450" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0a0c10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0.62" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#b0c0d0" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#586878" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0a0c10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2228"/>
      <stop offset="1" stop-color="#080a0c"/>
    </linearGradient>
    <radialGradient id="groundMist" cx="0.5" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#1a1e24" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#080a0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <!-- distant dirty mountains under rain light -->
  <path d="M-40 390 L140 270 L290 320 L450 230 L610 300 L790 210 L950 290 L1170 240 L1240 430 L-40 430 Z" fill="#14181e"/>
  <path d="M-60 410 L110 310 L250 360 L420 280 L580 350 L750 260 L930 330 L1190 280 L1260 460 L-60 460 Z" fill="#10141a" opacity="0.9"/>
  <path d="M-20 440 L170 350 L330 400 L510 320 L690 390 L870 310 L1070 370 L1270 330 L1270 510 L-20 510 Z" fill="#0c1014"/>
  <!-- wet road stretching forward -->
  <path d="M230 750 L430 440 L610 435 L790 750 Z" fill="url(#roadg)"/>
  <path d="M270 750 L460 460 L570 458 L690 750 Z" fill="#1a1e24" opacity="0.8"/>
  <path d="M330 750 L490 480 L530 478 L590 750 Z" fill="#242830" opacity="0.4"/>
  <!-- volumetric shaft muted by rain, from upper right -->
  <path d="M640 0 L1000 0 L740 530 L420 530 Z" fill="url(#shaft)"/>
  <path d="M700 10 L940 10 L780 470 L580 470 Z" fill="#c0d0e0" opacity="0.05"/>
  <!-- soft rain light disk -->
  <circle cx="800" cy="100" r="72" fill="#c8d8e8" opacity="0.1"/>
  <circle cx="800" cy="100" r="40" fill="#d8e8f0" opacity="0.05"/>
  <!-- rain streaks subtle -->
  <g opacity="0.18" stroke="#a8b8c8" stroke-width="1.2">
    <line x1="180" y1="80" x2="165" y2="160"/>
    <line x1="320" y1="40" x2="305" y2="130"/>
    <line x1="480" y1="60" x2="468" y2="145"/>
    <line x1="620" y1="30" x2="605" y2="120"/>
    <line x1="860" y1="50" x2="848" y2="140"/>
    <line x1="980" y1="90" x2="965" y2="175"/>
    <line x1="1100" y1="40" x2="1088" y2="125"/>
    <line x1="250" y1="200" x2="238" y2="280"/>
    <line x1="550" y1="180" x2="540" y2="255"/>
    <line x1="750" y1="210" x2="738" y2="290"/>
    <line x1="920" y1="190" x2="908" y2="270"/>
  </g>
  <!-- small traveler silhouette on the wet road -->
  <ellipse cx="500" cy="500" rx="10" ry="3.5" fill="#040608" opacity="0.6"/>
  <path d="M492 500 L496 476 L500 458 L508 458 L512 476 L516 500 Z" fill="#0a0c10"/>
  <path d="M500 458 L492 442 L502 436 L512 442 L506 458 Z" fill="#101418"/>
  <!-- low wet ground mist -->
  <ellipse cx="530" cy="655" rx="500" ry="105" fill="url(#groundMist)"/>
  <!-- faint left ridge -->
  <path d="M-70 380 L50 290 L130 330 L-70 410 Z" fill="#161a20" opacity="0.55"/>
</svg>
