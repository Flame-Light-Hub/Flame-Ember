<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1a18"/>
      <stop offset="0.35" stop-color="#4a3f35"/>
      <stop offset="0.7" stop-color="#2a221c"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="dust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a4a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9a06a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8a6a4a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vol" cx="0.72" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#e8c48a" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#a07848" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2a221c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#vol)"/>
