  <path d="M-40 420 L180 290 L340 380 L520 250 L710 360 L900 210 L1100 340 L1240 280 L1240 420 Z" fill="#2a2620"/>
  <path d="M-20 430 L220 310 L380 400 L560 270 L750 380 L940 230 L1120 360 L1240 300 L1240 430 Z" fill="#1e1c18" opacity="0.85"/>
  <path d="M0 440 L260 340 L420 420 L600 300 L780 410 L980 270 L1180 390 L1240 330 L1240 440 Z" fill="#151310"/>
