<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a08"/>
      <stop offset="0.3" stop-color="#2a1e14"/>
      <stop offset="0.6" stop-color="#4a3828"/>
      <stop offset="0.85" stop-color="#3a2c1c"/>
      <stop offset="1" stop-color="#1a120c"/>
    </linearGradient>
    <linearGradient id="shaftS" x1="0.4" y1="0.1" x2="0.6" y2="1">
      <stop offset="0" stop-color="#d8b080" stop-opacity="0.05"/>
      <stop offset="0.4" stop-color="#a07040" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#503020" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a0604" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hazeS" cx="0.5" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#806040" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#3a2818" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#080604" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2218"/>
      <stop offset="1" stop-color="#0e0a06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#skyS)"/>
  <!-- distant mountains sinking into haze -->
  <polygon points="0,320 140,180 320,240 500,140 680,220 860,160 1040,230 1200,190 1200,750 0,750" fill="#0c0a08" opacity="0.9"/>
  <polygon points="360,160 600,90 820,200 680,250 440,220" fill="#14100c" opacity="0.65"/>
  <!-- volumetric light sinking low -->
  <ellipse cx="620" cy="280" rx="180" ry="220" fill="url(#shaftS)"/>
  <ellipse cx="580" cy="420" rx="320" ry="160" fill="url(#hazeS)"/>
  <!-- dirty road with deep ruts -->
  <path d="M180,750 Q420,520 620,380 Q780,280 980,220" fill="none" stroke="#1a140e" stroke-width="90" opacity="0.85"/>
  <path d="M200,750 Q440,530 640,390 Q790,290 990,230" fill="none" stroke="#2a2018" stroke-width="28" opacity="0.5"/>
  <path d="M160,750 Q400,510 600,370 Q770,270 970,210" fill="none" stroke="#0e0a06" stroke-width="12" opacity="0.7"/>
  <!-- dry grass clumps -->
  <g opacity="0.4" fill="#3a2c1c">
    <ellipse cx="280" cy="620" rx="40" ry="12"/>
    <ellipse cx="420" cy="560" rx="28" ry="9"/>
    <ellipse cx="520" cy="480" rx="35" ry="10"/>
    <ellipse cx="720" cy="360" rx="22" ry="8"/>
  </g>
  <!-- small traveler silhouette facing the sinking light -->
  <g transform="translate(540,430)">
    <ellipse cx="0" cy="28" rx="14" ry="6" fill="#0a0806" opacity="0.5"/>
    <path d="M-6,22 L-4,8 Q0,-2 4,8 L6,22 Z" fill="#1a1410"/>
    <circle cx="0" cy="2" r="5" fill="#12100c"/>
    <path d="M-3,8 L-8,18 M3,8 L9,16" stroke="#1a1410" stroke-width="2.5" fill="none"/>
  </g>
  <!-- extra dirt texture -->
  <g opacity="0.15" fill="#4a3828">
    <circle cx="310" cy="680" r="3"/>
    <circle cx="450" cy="640" r="2"/>
    <circle cx="590" cy="520" r="2.5"/>
    <circle cx="710" cy="440" r="2"/>
  </g>
</svg>
