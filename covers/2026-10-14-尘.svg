<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e10"/>
      <stop offset="0.25" stop-color="#2c2820"/>
      <stop offset="0.55" stop-color="#5a4e3a"/>
      <stop offset="0.8" stop-color="#8a7a5c"/>
      <stop offset="1" stop-color="#6a5a42"/>
    </linearGradient>
    <linearGradient id="shaftD" x1="0.35" y1="0" x2="0.48" y2="1">
      <stop offset="0" stop-color="#f0e4c0" stop-opacity="0.02"/>
      <stop offset="0.35" stop-color="#c8a870" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#8a7050" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3a2e20" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dustD" cx="0.48" cy="0.62" r="0.42">
      <stop offset="0" stop-color="#c0a880" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#7a6848" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2a2218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4030"/>
      <stop offset="1" stop-color="#1c1810"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#skyD)"/>
  <!-- distant mountains -->
  <polygon points="0,240 160,170 340,210 520,130 700,190 880,150 1060,200 1200,180 1200,750 0,750" fill="#0e100e" opacity="0.95"/>
  <polygon points="380,150 620,90 840,160 720,220 480,200" fill="#141816" opacity="0.8"/>
  <!-- volumetric light shafts -->
  <polygon points="280,0 420,0 680,750 380,750" fill="url(#shaftD)" opacity="0.7"/>
  <polygon points="520,0 640,0 820,750 560,750" fill="url(#shaftD)" opacity="0.45"/>
  <!-- dust haze -->
  <ellipse cx="580" cy="480" rx="480" ry="200" fill="url(#dustD)"/>
  <!-- mid ground hills -->
  <polygon points="0,380 220,340 420,400 640,350 860,390 1080,360 1200,380 1200,750 0,750" fill="#2a2820" opacity="0.75"/>
  <!-- path -->
  <polygon points="480,520 720,520 800,750 400,750" fill="url(#pathD)" opacity="0.9"/>
  <path d="M520 540 Q600 580 680 620 L700 750 L500 750 Z" fill="#3a3428" opacity="0.6"/>
  <!-- dirt texture lines -->
  <path d="M540 560 Q600 590 660 640" stroke="#5a5040" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M560 600 Q620 630 680 680" stroke="#4a4030" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- small figure silhouette -->
  <g transform="translate(620, 580)">
    <ellipse cx="0" cy="8" rx="6" ry="12" fill="#0a0806"/>
    <path d="M-4 18 L-6 48 L6 48 L4 18 Z" fill="#0a0806"/>
    <path d="M-8 28 L-18 36 L-6 32" fill="#0a0806"/>
    <path d="M8 28 L18 36 L6 32" fill="#0a0806"/>
  </g>
  <!-- foreground dust -->
  <rect width="1200" height="80" y="670" fill="#1a1612" opacity="0.5"/>
</svg>
