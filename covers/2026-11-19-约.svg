<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1210;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3d2a22;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#6b4a32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="light" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d0a0;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#d4a070;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8a5a30;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" style="stop-color:#ffcc88;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffcc88;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="800" cy="350" rx="400" ry="200" fill="url(#glow)"/>
  <!-- volumetric light rays -->
  <polygon points="700,200 750,1000 650,1000" fill="#f0d8b0" opacity="0.08"/>
  <polygon points="800,150 900,1000 700,1000" fill="#f5e0c0" opacity="0.12"/>
  <polygon points="900,220 1000,1000 800,1000" fill="#e8c8a0" opacity="0.06"/>
  <!-- distant mountains -->
  <polygon points="0,650 200,520 400,580 600,480 800,540 1000,460 1200,520 1400,480 1600,560 1600,1000 0,1000" fill="#2a1e18" opacity="0.7"/>
  <polygon points="100,680 300,560 500,620 700,500 900,560 1100,480 1300,540 1500,500 1600,580 1600,1000 0,1000" fill="#3a2a22" opacity="0.5"/>
  <!-- mid mountains -->
  <polygon points="0,750 150,640 350,700 550,600 750,680 950,590 1150,650 1350,600 1550,670 1600,700 1600,1000 0,1000" fill="#4a3428"/>
  <!-- road -->
  <polygon points="400,1000 600,720 1000,720 1200,1000" fill="#3a2a20"/>
  <polygon points="500,1000 650,760 950,760 1100,1000" fill="#4a3228" opacity="0.6"/>
  <!-- dirt texture lines -->
  <path d="M550 980 L700 780" stroke="#5a4030" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M650 990 L750 790" stroke="#6a5040" stroke-width="1" opacity="0.3" fill="none"/>
  <!-- small figure silhouette -->
  <g transform="translate(780,780)">
    <ellipse cx="0" cy="40" rx="18" ry="6" fill="#1a1210" opacity="0.5"/>
    <path d="M-8,30 L-4,10 L0,-5 L4,10 L8,30 Z" fill="#1a1010"/>
    <circle cx="0" cy="-12" r="6" fill="#1a1010"/>
    <path d="M-12,20 Q-15,35 -8,40" stroke="#1a1010" stroke-width="2" fill="none"/>
    <path d="M12,20 Q15,35 8,40" stroke="#1a1010" stroke-width="2" fill="none"/>
  </g>
  <!-- dust particles -->
  <circle cx="600" cy="700" r="1.5" fill="#c0a080" opacity="0.4"/>
  <circle cx="700" cy="650" r="1" fill="#d0b090" opacity="0.3"/>
  <circle cx="900" cy="720" r="2" fill="#b09070" opacity="0.35"/>
  <circle cx="850" cy="680" r="1.2" fill="#e0c0a0" opacity="0.25"/>
  <!-- title overlay subtle -->
  <text x="80" y="120" font-family="serif" font-size="28" fill="#e8d8c0" opacity="0.15">约</text>
</svg>
