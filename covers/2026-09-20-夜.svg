<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.28" stop-color="#14161f"/>
      <stop offset="0.55" stop-color="#1c1a18"/>
      <stop offset="0.78" stop-color="#12100e"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.72" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#c8b898" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#8a7858" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#2a2418" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#0a0907" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0.65" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#b8a878" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#6a5a38" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#12100c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a241e"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="mist" cx="0.5" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#1e1c18" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a0907" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#moonGlow)"/>
  <!-- distant dirty mountains, cooler slate-ochre under night -->
  <path d="M-50 390 L120 250 L280 340 L450 200 L640 310 L810 180 L980 290 L1150 220 L1260 280 L1260 420 L-50 420 Z" fill="#1a1814"/>
  <path d="M-30 410 L180 270 L340 360 L510 220 L700 340 L870 200 L1040 310 L1220 240 L1260 300 L1260 440 L-30 440 Z" fill="#12100c" opacity="0.92"/>
  <path d="M0 430 L220 300 L380 380 L550 250 L740 370 L910 230 L1080 340 L1260 270 L1260 460 L0 460 Z" fill="#0a0907"/>
  <!-- road stretching into dark -->
  <path d="M380 750 L500 460 L620 455 L740 750 Z" fill="url(#roadg)"/>
  <path d="M420 750 L530 485 L595 482 L680 750 Z" fill="#1a1713" opacity="0.8"/>
  <path d="M470 750 L555 505 L580 503 L630 750 Z" fill="#2a251f" opacity="0.45"/>
  <!-- volumetric shaft from upper right moon side -->
  <path d="M780 20 L980 20 L720 520 L480 520 Z" fill="url(#shaft)"/>
  <path d="M820 40 L920 40 L780 460 L640 460 Z" fill="#c8b898" opacity="0.06"/>
  <!-- faint moon disk -->
  <circle cx="880" cy="120" r="38" fill="#d4c8a8" opacity="0.22"/>
  <circle cx="880" cy="120" r="28" fill="#e8dcc0" opacity="0.12"/>
  <!-- small traveler silhouette farther on road -->
  <ellipse cx="555" cy="512" rx="10" ry="3.5" fill="#050403" opacity="0.6"/>
  <path d="M549 512 L551 492 L553 478 L560 478 L562 492 L564 512 Z" fill="#0c0a08"/>
  <path d="M553 478 L547 465 L556 460 L565 465 L560 478 Z" fill="#10100c"/>
  <!-- low ground mist -->
  <ellipse cx="580" cy="640" rx="320" ry="55" fill="url(#mist)"/>
  <ellipse cx="450" cy="700" rx="220" ry="35" fill="#0e0c0a" opacity="0.35"/>
  <!-- sparse night dust / faint stars suggestion -->
  <g fill="#c8b898" opacity="0.18">
    <circle cx="180" cy="90" r="1.2"/>
    <circle cx="320" cy="55" r="0.9"/>
    <circle cx="480" cy="110" r="1.1"/>
    <circle cx="620" cy="40" r="0.8"/>
    <circle cx="1050" cy="80" r="1.3"/>
    <circle cx="150" cy="160" r="0.7"/>
  </g>
</svg>