<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1610"/>
      <stop offset="35%" stop-color="#4a3a22"/>
      <stop offset="70%" stop-color="#7a5a32"/>
      <stop offset="100%" stop-color="#a07848"/>
    </linearGradient>
    <linearGradient id="vol" x1="0.75" y1="0.1" x2="0.45" y2="0.85">
      <stop offset="0%" stop-color="#f5d89a" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#d4a060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a07840" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dust" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#c8a070" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6a4a28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- distant mountains -->
  <polygon points="0,480 180,340 340,410 520,290 700,360 880,270 1040,340 1200,380 1200,800 0,800" fill="#2a1e14" opacity="0.95"/>
  <polygon points="80,460 260,310 460,380 640,280 820,340 1000,300 1200,420 1200,800 0,800" fill="#3a2a1c" opacity="0.75"/>
  <polygon points="200,440 380,330 560,370 740,300 920,350 1100,320 1200,450 1200,800 0,800" fill="#4a3826" opacity="0.55"/>
  <!-- road / earth -->
  <path d="M0 620 Q280 590 560 610 T1200 595 L1200 800 L0 800 Z" fill="#5a422c"/>
  <path d="M120 600 Q360 575 600 590 T1080 575 L1080 700 L120 700 Z" fill="#6a5238" opacity="0.7"/>
  <!-- volumetric light beams -->
  <path d="M920 80 L480 720 L620 720 Z" fill="url(#vol)" opacity="0.55"/>
  <path d="M860 100 L520 700 L600 700 Z" fill="#f0d080" opacity="0.12"/>
  <rect width="1200" height="800" fill="url(#dust)"/>
  <!-- small figure silhouette on the road -->
  <ellipse cx="540" cy="655" rx="18" ry="5" fill="#1a1208" opacity="0.4"/>
  <path d="M532 640 L540 620 L548 640 L546 670 L534 670 Z" fill="#140e08"/>
  <circle cx="540" cy="612" r="6" fill="#140e08"/>
  <!-- title mark low -->
  <text x="600" y="760" font-family="serif" font-size="28" fill="#c8b090" text-anchor="middle" opacity="0.45">判</text>
</svg>
