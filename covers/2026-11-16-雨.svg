<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1e22;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2e2a26;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4a3e34;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a5648;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#c8b890;stop-opacity:0.05" />
      <stop offset="40%" style="stop-color:#e0d0a0;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#f8f0d0;stop-opacity:0.45" />
    </linearGradient>
    <filter id="wet">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Distant dirty mountains under rain haze -->
  <path d="M0 400 Q200 260 450 350 Q700 200 950 320 Q1100 280 1200 370 L1200 800 L0 800 Z" fill="#3a322c" opacity="0.85"/>
  <path d="M0 460 Q300 340 600 420 Q850 280 1200 440 L1200 800 L0 800 Z" fill="#4a3e36" opacity="0.6"/>
  <path d="M0 520 Q400 400 750 480 Q1000 360 1200 500 L1200 800 L0 800 Z" fill="#2a241e" opacity="0.45"/>
  <!-- Wet muddy road reflecting light -->
  <path d="M380 800 Q450 650 490 520 Q530 390 600 280 L640 240 Q560 380 520 540 Q460 680 400 800 Z" fill="#2e2824" filter="url(#wet)"/>
  <path d="M400 800 Q470 660 510 530 Q550 400 610 300 L630 260" stroke="#5a4a3c" stroke-width="4" fill="none" opacity="0.4"/>
  <!-- Volumetric light through rain -->
  <polygon points="520,200 780,800 380,800" fill="url(#rainlight)" opacity="0.7"/>
  <polygon points="560,240 820,800 420,800" fill="#e8d8a0" opacity="0.18"/>
  <!-- Rain streaks -->
  <g stroke="#a09080" stroke-width="1" opacity="0.35">
    <line x1="200" y1="100" x2="185" y2="180"/>
    <line x1="350" y1="80" x2="335" y2="160"/>
    <line x1="480" y1="120" x2="465" y2="200"/>
    <line x1="620" y1="90" x2="605" y2="170"/>
    <line x1="750" y1="110" x2="735" y2="190"/>
    <line x1="900" y1="70" x2="885" y2="150"/>
    <line x1="1050" y1="100" x2="1035" y2="180"/>
  </g>
  <!-- Small traveler silhouette in rain, facing the light -->
  <path d="M560 560 L555 620 L548 690 L562 692 L568 620 L572 570 Z" fill="#12100e"/>
  <circle cx="564" cy="535" r="8" fill="#12100e"/>
  <!-- Water reflection on ground -->
  <ellipse cx="520" cy="740" rx="60" ry="15" fill="#4a3c32" opacity="0.5"/>
  <rect x="0" y="720" width="1200" height="80" fill="#5a4a3c" opacity="0.15"/>
</svg>
