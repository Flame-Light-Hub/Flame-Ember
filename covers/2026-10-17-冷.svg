<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e12"/>
      <stop offset="0.35" stop-color="#2a2820"/>
      <stop offset="0.65" stop-color="#4a4030"/>
      <stop offset="0.9" stop-color="#6a5a42"/>
      <stop offset="1" stop-color="#3a3024"/>
    </linearGradient>
    <linearGradient id="shaftC" x1="0.35" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#d8c8a0" stop-opacity="0.04"/>
      <stop offset="0.45" stop-color="#a08058" stop-opacity="0.38"/>
      <stop offset="0.8" stop-color="#6a5030" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1a140c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hazeC" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#908060" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#5a4a30" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0c0a08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3428"/>
      <stop offset="1" stop-color="#12100c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#skyC)"/>
  <!-- distant mountains -->
  <polygon points="0,280 200,140 380,210 560,110 740,190 920,150 1100,210 1200,160 1200,750 0,750" fill="#0a0c0a" opacity="0.97"/>
  <polygon points="420,130 680,60 900,160 760,220 500,200" fill="#101210" opacity="0.7"/>
  <!-- volumetric light -->
  <polygon points="280,0 420,0 680,750 380,750" fill="url(#shaftC)" opacity="0.7"/>
  <polygon points="540,0 660,0 820,750 580,750" fill="url(#shaftC)" opacity="0.35"/>
  <!-- haze -->
  <ellipse cx="600" cy="490" rx="520" ry="240" fill="url(#hazeC)"/>
  <!-- mid hills -->
  <polygon points="0,410 220,370 440,420 660,380 880,410 1100,390 1200,410 1200,750 0,750" fill="#26221c" opacity="0.75"/>
  <!-- wet road -->
  <polygon points="380,500 820,500 900,750 300,750" fill="url(#pathC)" opacity="0.9"/>
  <path d="M450 520 Q600 560 750 620 L800 750 L400 750 Z" fill="#2e2a20" opacity="0.6"/>
  <!-- puddles / wet sheen -->
  <ellipse cx="540" cy="580" rx="40" ry="8" fill="#4a4030" opacity="0.4"/>
  <ellipse cx="680" cy="640" rx="30" ry="6" fill="#3a3428" opacity="0.35"/>
  <!-- small figure walking -->
  <g transform="translate(610, 590)">
    <ellipse cx="0" cy="5" rx="4.5" ry="10" fill="#070504"/>
    <path d="M-2.5 14 L-4.5 42 L4.5 42 L2.5 14 Z" fill="#070504"/>
    <path d="M-6 22 L-14 32 L-4 28" fill="#070504"/>
    <path d="M6 22 L14 30 L4 26" fill="#070504"/>
  </g>
  <!-- distant light dust -->
  <circle cx="200" cy="300" r="1.5" fill="#a09070" opacity="0.3"/>
  <circle cx="900" cy="320" r="1" fill="#908060" opacity="0.25"/>
</svg>