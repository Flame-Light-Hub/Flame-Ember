<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1814;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#3a3228;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#6a543c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6e4c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windlight" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" style="stop-color:#d4c4a0;stop-opacity:0.08" />
      <stop offset="35%" style="stop-color:#e8d8b0;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#f4e8c8;stop-opacity:0.55" />
    </linearGradient>
    <filter id="dust">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Distant dirty mountains under wind haze -->
  <path d="M0 380 Q180 220 420 320 Q680 180 980 300 Q1120 260 1200 360 L1200 800 L0 800 Z" fill="#3c342c" opacity="0.9"/>
  <path d="M0 440 Q280 300 620 400 Q880 260 1200 420 L1200 800 L0 800 Z" fill="#4e4238" opacity="0.65"/>
  <path d="M0 500 Q360 380 780 460 Q1040 340 1200 490 L1200 800 L0 800 Z" fill="#2a241c" opacity="0.5"/>
  <!-- Dusty road climbing into light -->
  <path d="M360 800 Q430 640 480 500 Q530 360 590 240 L640 190 Q570 340 520 500 Q450 660 390 800 Z" fill="#3a3228" filter="url(#dust)"/>
  <path d="M380 800 Q450 650 500 510 Q550 370 610 250" stroke="#6a5a48" stroke-width="5" fill="none" opacity="0.45"/>
  <!-- Volumetric light through wind dust -->
  <polygon points="500,160 820,800 360,800" fill="url(#windlight)" opacity="0.75"/>
  <polygon points="540,200 860,800 400,800" fill="#f0e0b8" opacity="0.22"/>
  <!-- Dust streaks / wind -->
  <g stroke="#c8b898" stroke-width="1.2" opacity="0.35">
    <line x1="200" y1="180" x2="320" y2="320"/>
    <line x1="280" y1="220" x2="410" y2="380"/>
    <line x1="150" y1="260" x2="290" y2="440"/>
    <line x1="700" y1="140" x2="820" y2="280"/>
    <line x1="780" y1="180" x2="910" y2="340"/>
    <line x1="640" y1="220" x2="760" y2="390"/>
  </g>
  <!-- Small figure silhouette facing the light, coat blown by wind -->
  <path d="M620 520 L628 480 L640 460 L652 480 L660 530 L655 620 L635 620 L630 540 Z" fill="#1a1612" opacity="0.95"/>
  <path d="M640 450 Q655 430 665 450 Q670 465 655 470 L640 450" fill="#1a1612"/>
  <!-- Coat flapping -->
  <path d="M655 490 Q680 510 690 540 Q685 560 660 545" fill="#1a1612" opacity="0.8"/>
  <!-- Ground dust near feet -->
  <ellipse cx="645" cy="630" rx="28" ry="6" fill="#5a4a3c" opacity="0.5"/>
</svg>
