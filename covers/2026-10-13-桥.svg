<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0e"/>
      <stop offset="0.3" stop-color="#2a2822"/>
      <stop offset="0.6" stop-color="#5c5240"/>
      <stop offset="1" stop-color="#8a7858"/>
    </linearGradient>
    <linearGradient id="shaftB" x1="0.4" y1="0" x2="0.52" y2="1">
      <stop offset="0" stop-color="#f4e6c8" stop-opacity="0.01"/>
      <stop offset="0.4" stop-color="#c8a878" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4a3c28" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dustB" cx="0.5" cy="0.55" r="0.38">
      <stop offset="0" stop-color="#b8a888" stop-opacity="0.25"/>
      <stop offset="0.75" stop-color="#786858" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#302820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bridgeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a382e"/>
      <stop offset="1" stop-color="#1a1814"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#skyB)"/>
  <!-- distant mountains -->
  <polygon points="0,220 180,160 380,200 560,120 760,180 980,140 1200,190 1200,750 0,750" fill="#0e1012" opacity="0.92"/>
  <polygon points="420,140 680,80 900,150 760,220 520,190" fill="#161a18" opacity="0.75"/>
  <ellipse cx="600" cy="420" rx="420" ry="180" fill="url(#dustB)"/>
  <!-- mid hills -->
  <polygon points="0,340 260,300 480,360 700,310 940,350 1200,320 1200,750 0,750" fill="#2e2c26" opacity="0.7"/>
  <!-- light shaft -->
  <polygon points="480,0 580,0 640,750 420,750" fill="url(#shaftB)"/>
  <path d="M510,30 L540,90 L525,160 L550,250 L520,360 L545,480 L515,620" stroke="#e0d0a0" stroke-width="1.4" fill="none" opacity="0.32"/>
  <!-- bridge / path -->
  <polygon points="180,620 320,480 480,520 720,460 900,510 1020,440 1200,500 1200,680 0,700 80,640" fill="url(#bridgeB)"/>
  <path d="M200,580 C350,520 500,540 680,500 C820,470 960,510 1100,480" stroke="#6a5a48" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M160,610 C340,560 520,580 700,540 C860,510 980,550 1120,520" stroke="#4a3e32" stroke-width="1.2" fill="none" opacity="0.3"/>
  <!-- foreground ground -->
  <polygon points="0,640 200,600 400,650 700,610 1000,660 1200,630 1200,750 0,750" fill="#2a2620" opacity="0.85"/>
  <!-- small figure on bridge -->
  <g fill="#0c0a08" opacity="0.85">
    <ellipse cx="560" cy="505" rx="4.5" ry="6"/>
    <path d="M556,512 L550,545 L558,545 L562,522 L568,545 L574,543 L566,512 Z"/>
    <path d="M554,518 L538,535 L542,539 L560,524 Z"/>
    <path d="M562,530 L554,548 L559,550 M570,528 L576,546 L571,548"/>
  </g>
  <ellipse cx="560" cy="550" rx="28" ry="4" fill="#a89870" opacity="0.1"/>
  <rect x="0" y="720" width="1200" height="30" fill="#060504" opacity="0.25"/>
</svg>