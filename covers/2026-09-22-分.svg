<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2a24"/>
      <stop offset="0.18" stop-color="#4a4034"/>
      <stop offset="0.42" stop-color="#6e5a40"/>
      <stop offset="0.68" stop-color="#3a3224"/>
      <stop offset="1" stop-color="#14110c"/>
    </linearGradient>
    <radialGradient id="volLight" cx="0.62" cy="0.18" r="0.58">
      <stop offset="0" stop-color="#e0c890" stop-opacity="0.48"/>
      <stop offset="0.3" stop-color="#b89860" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#5a4830" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#14110c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0.65" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#d4bc88" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#7a6438" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#14110c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#322c22"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="groundMist" cx="0.5" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#2a241c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0c0a08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#volLight)"/>
  <!-- dirty distant mountains, ochre-slate, slightly asymmetric for equinox balance -->
  <path d="M-80 390 L120 240 L290 330 L460 200 L640 310 L820 180 L1000 290 L1180 220 L1280 280 L1280 440 L-80 440 Z" fill="#28241c"/>
  <path d="M-50 410 L150 260 L320 350 L500 220 L680 340 L860 200 L1040 310 L1220 240 L1280 300 L1280 460 L-50 460 Z" fill="#1c1812" opacity="0.95"/>
  <path d="M0 430 L180 290 L360 370 L540 250 L720 360 L900 230 L1080 330 L1260 270 L1280 480 L0 480 Z" fill="#12100c"/>
  <!-- road stretching into the light, slightly off-center -->
  <path d="M340 750 L470 450 L620 445 L750 750 Z" fill="url(#roadg)"/>
  <path d="M380 750 L500 475 L590 472 L680 750 Z" fill="#28241c" opacity="0.7"/>
  <path d="M430 750 L525 495 L555 493 L610 750 Z" fill="#3a3228" opacity="0.35"/>
  <!-- volumetric shaft from upper mid-right -->
  <path d="M680 0 L960 0 L700 520 L440 520 Z" fill="url(#shaft)"/>
  <path d="M740 15 L900 15 L740 460 L580 460 Z" fill="#e0c890" opacity="0.06"/>
  <!-- soft equinox sun disk, lower and more centered than previous -->
  <circle cx="780" cy="130" r="52" fill="#e8d4a0" opacity="0.16"/>
  <circle cx="780" cy="130" r="34" fill="#f0e0b8" opacity="0.09"/>
  <!-- small traveler silhouette on road, facing the light -->
  <ellipse cx="535" cy="505" rx="10" ry="3.5" fill="#0a0806" opacity="0.5"/>
  <path d="M528 505 L531 484 L534 468 L542 468 L545 484 L548 505 Z" fill="#10100c"/>
  <path d="M533 468 L526 454 L536 448 L546 454 L540 468 Z" fill="#16140e"/>
  <!-- low ground mist -->
  <ellipse cx="600" cy="680" rx="420" ry="90" fill="url(#groundMist)"/>
  <!-- faint horizon haze line -->
  <path d="M0 420 Q600 400 1200 415" fill="none" stroke="#4a4030" stroke-width="1.5" opacity="0.25"/>
</svg>