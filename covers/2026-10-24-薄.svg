<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c0e"/>
      <stop offset="0.25" stop-color="#1c2218"/>
      <stop offset="0.5" stop-color="#2e281c"/>
      <stop offset="0.75" stop-color="#221c14"/>
      <stop offset="1" stop-color="#0e0c0a"/>
    </linearGradient>
    <linearGradient id="shaftB" x1="0.35" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#c8b888" stop-opacity="0.08"/>
      <stop offset="0.35" stop-color="#907050" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#402818" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#040302" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hazeB" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#706040" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#181410" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#030201" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1612"/>
      <stop offset="1" stop-color="#060504"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#skyB)"/>
  <!-- distant mountains in thin fog -->
  <polygon points="0,220 140,150 280,190 420,110 560,160 700,120 840,170 980,130 1120,180 1200,160 1200,750 0,750" fill="#080604" opacity="0.85"/>
  <polygon points="200,140 440,70 680,150 520,190 280,160" fill="#0e0c0a" opacity="0.55"/>
  <!-- volumetric light through thin fog -->
  <polygon points="280,50 460,20 700,750 360,750" fill="url(#shaftB)" opacity="0.65"/>
  <polygon points="520,80 680,50 820,750 560,750" fill="url(#shaftB)" opacity="0.25"/>
  <!-- thicker haze for thin fog -->
  <ellipse cx="600" cy="500" rx="680" ry="240" fill="url(#hazeB)"/>
  <!-- mid ground -->
  <polygon points="0,440 180,400 420,450 660,410 900,440 1200,420 1200,750 0,750" fill="#141210" opacity="0.75"/>
  <!-- road -->
  <polygon points="180,470 1020,470 1100,750 100,750" fill="url(#pathB)" opacity="0.92"/>
  <path d="M280 490 Q500 540 720 640 L760 750 L240 750 Z" fill="#181410" opacity="0.45"/>
  <!-- tracks in fog -->
  <path d="M360 510 L440 750" stroke="#100e0c" stroke-width="3.5" opacity="0.4" fill="none"/>
  <path d="M520 520 L600 750" stroke="#100e0c" stroke-width="2" opacity="0.3" fill="none"/>
  <!-- very thin small figure -->
  <g transform="translate(460, 660)">
    <ellipse cx="0" cy="0" rx="2" ry="4.5" fill="#010101"/>
    <path d="M-0.8 4 L-3 28 L3 28 L0.8 4 Z" fill="#010101"/>
    <path d="M-1 11 L-7 17 L0 14" fill="#010101"/>
    <path d="M1 11 L8 16 L0.5 13" fill="#010101"/>
  </g>
  <!-- dust in thin air -->
  <circle cx="380" cy="420" r="1.2" fill="#806040" opacity="0.3"/>
  <circle cx="720" cy="380" r="0.8" fill="#907050" opacity="0.25"/>
  <circle cx="540" cy="560" r="1" fill="#705040" opacity="0.2"/>
</svg>
