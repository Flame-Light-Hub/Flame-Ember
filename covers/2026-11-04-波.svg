<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1216"/>
      <stop offset="35%" stop-color="#2a241c"/>
      <stop offset="70%" stop-color="#3c3428"/>
      <stop offset="100%" stop-color="#5a4a3a"/>
    </linearGradient>
    <linearGradient id="vol" x1="0.6" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f0d8b0" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#c0a070" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6a5040" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e342c"/>
      <stop offset="100%" stop-color="#1c1612"/>
    </linearGradient>
    <linearGradient id="road" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4e4036"/>
      <stop offset="100%" stop-color="#2c241e"/>
    </linearGradient>
    <filter id="dust">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="0.35 0 0 0 0.18  0 0.28 0 0 0.12  0 0 0.18 0 0.08  0 0 0 0.18 0"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- volumetric light rays suggesting a wave of light -->
  <polygon points="200,40 480,520 120,520" fill="url(#vol)" opacity="0.55"/>
  <polygon points="280,20 620,540 180,540" fill="url(#vol)" opacity="0.4"/>
  <polygon points="360,60 740,480 240,480" fill="url(#vol)" opacity="0.3"/>
  <!-- distant mountains -->
  <polygon points="0,360 160,200 300,280 480,150 680,260 860,140 1040,240 1200,320 1200,630 0,630" fill="url(#mtn)" opacity="0.9"/>
  <polygon points="0,410 220,260 440,340 680,220 900,310 1200,380 1200,630 0,630" fill="#241c18" opacity="0.55"/>
  <!-- winding road -->
  <polygon points="420,630 520,380 600,630" fill="url(#road)"/>
  <polygon points="440,630 540,420 620,630" fill="#3a322a" opacity="0.45"/>
  <!-- ground dirt and dust -->
  <rect x="0" y="460" width="1200" height="170" fill="#3a322c" opacity="0.35"/>
  <!-- small figure silhouette on the road, facing the light -->
  <g transform="translate(545,455)">
    <path d="M0,48 L-7,22 L-5,10 L5,10 L7,22 L0,48 Z" fill="#14100c"/>
    <circle cx="0" cy="5" r="5.5" fill="#14100c"/>
  </g>
  <!-- dust overlay -->
  <rect width="1200" height="630" filter="url(#dust)" opacity="0.22"/>
  <!-- subtle light edges -->
  <path d="M0,0 L1200,0 L1200,90 Q600,160 0,70 Z" fill="#e0c090" opacity="0.06"/>
</svg>
