<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1814;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#4a3c32;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#7a5e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a07a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warmlight" x1="60%" y1="20%" x2="45%" y2="75%">
      <stop offset="0%" style="stop-color:#f8e8c0;stop-opacity:0.55" />
      <stop offset="50%" style="stop-color:#e8c898;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#e8c898;stop-opacity:0" />
    </linearGradient>
    <filter id="dust">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Distant mountains, dirty ochre and brown -->
  <path d="M0 400 Q180 260 380 360 Q560 200 760 320 Q960 240 1200 370 L1200 800 L0 800 Z" fill="#5a4638" opacity="0.95"/>
  <path d="M0 460 Q280 340 540 420 Q820 300 1200 430 L1200 800 L0 800 Z" fill="#6b5544" opacity="0.75"/>
  <path d="M0 520 Q350 420 700 490 Q1050 380 1200 500 L1200 800 L0 800 Z" fill="#4e3e34" opacity="0.6"/>
  <!-- Road bending into warm light -->
  <path d="M420 800 Q480 620 520 480 Q560 360 640 280 L670 260 Q620 370 580 500 Q530 650 480 800 Z" fill="#3c342e" filter="url(#dust)"/>
  <!-- Volumetric warm light -->
  <polygon points="780,120 900,800 700,800" fill="url(#warmlight)" opacity="0.7"/>
  <polygon points="820,160 940,800 760,800" fill="#f0d8a8" opacity="0.18"/>
  <polygon points="740,140 860,800 680,800" fill="#e8d0a0" opacity="0.12"/>
  <!-- Small traveler silhouette facing the light -->
  <path d="M590 540 L596 505 L602 540 L608 522 L614 540 L602 555 L590 540" fill="#14100c"/>
  <circle cx="604" cy="498" r="7" fill="#14100c"/>
  <!-- Low dust and haze -->
  <rect width="1200" height="800" fill="#a07858" opacity="0.07"/>
  <ellipse cx="600" cy="700" rx="400" ry="60" fill="#8a6a50" opacity="0.12"/>
</svg>
