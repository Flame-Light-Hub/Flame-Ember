<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2a1a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#6b4a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="light" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e0a0;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#d4a060;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8a6a40;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)" />
  <!-- volumetric light rays -->
  <polygon points="200,0 400,800 500,800 300,0" fill="url(#light)" opacity="0.4" />
  <polygon points="350,0 550,800 650,800 450,0" fill="url(#light)" opacity="0.3" />
  <!-- distant mountains -->
  <polygon points="0,500 200,350 400,450 600,300 800,420 1000,280 1200,400 1200,800 0,800" fill="#2a3a4a" opacity="0.7" />
  <polygon points="100,550 300,400 500,500 700,380 900,480 1100,350 1200,450 1200,800 0,800" fill="#3a4a5a" opacity="0.6" />
  <!-- road -->
  <path d="M 100 800 Q 400 600 600 500 Q 800 400 1100 350" stroke="#5a4a3a" stroke-width="40" fill="none" opacity="0.5" />
  <path d="M 150 800 Q 420 620 620 520 Q 820 420 1080 370" stroke="#7a6a5a" stroke-width="20" fill="none" opacity="0.4" />
  <!-- small figure silhouette -->
  <g transform="translate(550,520)">
    <ellipse cx="0" cy="30" rx="12" ry="6" fill="#1a1a1a" opacity="0.8" />
    <path d="M -8 20 Q 0 0 8 20 L 5 35 L -5 35 Z" fill="#1a1a1a" />
    <circle cx="0" cy="-5" r="6" fill="#1a1a1a" />
  </g>
  <!-- dust particles -->
  <circle cx="300" cy="600" r="1.5" fill="#c0a080" opacity="0.4" />
  <circle cx="450" cy="550" r="1" fill="#b09070" opacity="0.3" />
  <circle cx="700" cy="480" r="2" fill="#d0b090" opacity="0.2" />
</svg>