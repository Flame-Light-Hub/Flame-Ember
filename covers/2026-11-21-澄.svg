<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1218;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2a241c;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#5a4a38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a6a50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="light" x1="50%" y1="10%" x2="50%" y2="90%">
      <stop offset="0%" style="stop-color:#ffe8c0;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#e0c090;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#a08060;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="25%" r="35%">
      <stop offset="0%" style="stop-color:#fff0d0;stop-opacity:0.55" />
      <stop offset="100%" style="stop-color:#fff0d0;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="880" cy="280" rx="350" ry="180" fill="url(#glow)"/>
  <!-- volumetric light rays, clearer -->
  <polygon points="750,120 850,1000 650,1000" fill="#f8e8c0" opacity="0.10"/>
  <polygon points="880,80 980,1000 780,1000" fill="#fff0d8" opacity="0.15"/>
  <polygon points="980,160 1080,1000 880,1000" fill="#e8d0a8" opacity="0.07"/>
  <polygon points="680,200 780,1000 580,1000" fill="#f0d8b0" opacity="0.05"/>
  <!-- distant mountains -->
  <polygon points="0,620 180,480 380,540 580,420 780,500 980,380 1180,460 1380,400 1600,520 1600,1000 0,1000" fill="#1a1612" opacity="0.75"/>
  <polygon points="80,660 280,520 480,580 680,460 880,520 1080,440 1280,500 1480,460 1600,540 1600,1000 0,1000" fill="#2a221c" opacity="0.55"/>
  <!-- mid mountains -->
  <polygon points="0,720 140,600 340,660 540,560 740,640 940,550 1140,610 1340,560 1540,630 1600,660 1600,1000 0,1000" fill="#3a2e24"/>
  <!-- road, dry and dusty -->
  <polygon points="380,1000 580,700 1020,700 1220,1000" fill="#2e241c"/>
  <polygon points="480,1000 640,740 960,740 1120,1000" fill="#3e2e24" opacity="0.65"/>
  <!-- dirt texture -->
  <path d="M520 970 L680 760" stroke="#4a3828" stroke-width="2" opacity="0.45" fill="none"/>
  <path d="M620 980 L740 770" stroke="#5a4838" stroke-width="1" opacity="0.3" fill="none"/>
  <path d="M900 990 L820 750" stroke="#4a3828" stroke-width="1.5" opacity="0.35" fill="none"/>
  <!-- small figure silhouette, facing light -->
  <g transform="translate(820,760)">
    <ellipse cx="0" cy="38" rx="16" ry="5" fill="#0e0c0a" opacity="0.45"/>
    <path d="M-7,28 L-3,8 L0,-8 L3,8 L7,28 Z" fill="#100e0c"/>
    <circle cx="0" cy="-14" r="5.5" fill="#100e0c"/>
    <path d="M-10,18 Q-14,32 -6,38" stroke="#100e0c" stroke-width="1.8" fill="none"/>
    <path d="M10,18 Q14,32 6,38" stroke="#100e0c" stroke-width="1.8" fill="none"/>
  </g>
  <!-- dust particles in light -->
  <circle cx="620" cy="680" r="1.2" fill="#d0b890" opacity="0.45"/>
  <circle cx="720" cy="620" r="0.8" fill="#e0c8a0" opacity="0.35"/>
  <circle cx="920" cy="700" r="1.8" fill="#c0a880" opacity="0.4"/>
  <circle cx="860" cy="650" r="1" fill="#f0d8b0" opacity="0.3"/>
  <circle cx="760" cy="710" r="1.4" fill="#d8c098" opacity="0.38"/>
</svg>
