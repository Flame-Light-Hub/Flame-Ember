<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1e28"/>
      <stop offset="30%" stop-color="#2e3540"/>
      <stop offset="60%" stop-color="#4a5460"/>
      <stop offset="100%" stop-color="#3a4038"/>
    </linearGradient>
    <radialGradient id="volLight" cx="55%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#e8f0f8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#c0d0e0" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#8090a0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4a5460" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6058"/>
      <stop offset="100%" stop-color="#2a2e28"/>
    </linearGradient>
    <filter id="dirty">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.9 0.1 0 0 0  0.1 0.8 0.1 0 0  0 0.1 0.9 0 0  0 0 0 0.12 0"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#volLight)"/>
  <!-- distant mountains, dirty cold tones -->
  <path d="M0 480 L140 280 L280 360 L420 220 L580 340 L740 180 L900 300 L1060 200 L1200 320 L1200 560 L0 560 Z" fill="#3a4038" opacity="0.55"/>
  <path d="M0 520 L200 320 L360 400 L520 260 L680 380 L840 240 L1000 340 L1200 280 L1200 600 L0 600 Z" fill="#2a3028" opacity="0.7"/>
  <path d="M0 560 L180 380 L340 460 L500 340 L660 440 L820 320 L980 420 L1200 360 L1200 640 L0 640 Z" fill="#1a1e18" opacity="0.82"/>
  <!-- road in perspective -->
  <path d="M360 800 L600 440 L840 800 Z" fill="url(#road)"/>
  <path d="M430 800 L600 480 L770 800 Z" fill="#6a7068" opacity="0.25"/>
  <!-- light shafts, cooler -->
  <polygon points="620,110 645,110 730,480 550,480" fill="#d8e8f0" opacity="0.14"/>
  <polygon points="540,130 575,130 690,500 470,500" fill="#e0f0f8" opacity="0.09"/>
  <polygon points="680,150 705,150 770,460 620,460" fill="#c0d0e0" opacity="0.08"/>
  <!-- small figure silhouette on road, facing light -->
  <ellipse cx="600" cy="655" rx="18" ry="6" fill="#101410" opacity="0.6"/>
  <path d="M588 655 L592 605 L600 598 L608 605 L612 655 Z" fill="#101410"/>
  <circle cx="600" cy="590" r="7" fill="#101410"/>
  <!-- frost-like texture hints on ground -->
  <path d="M400 720 Q420 710 440 720 T480 718" stroke="#d0e0e8" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M700 730 Q720 722 740 730" stroke="#c8d8e0" stroke-width="1" fill="none" opacity="0.25"/>
  <!-- dirty texture -->
  <rect width="1200" height="800" filter="url(#dirty)" opacity="0.4"/>
  <rect width="1200" height="800" fill="#1a2018" opacity="0.08"/>
</svg>
